<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Text to Speech Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    textarea {
      width: 100%;
      max-width: 600px;
    }
    #progress-bar {
      width: 100%;
      max-width: 600px;
      height: 10px;
      background: #ccc;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 15px;
      display: none;
    }
    #progress {
      width: 0%;
      height: 100%;
      background-color: #007bff;
      transition: width 0.3s ease-in-out;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
    #status.complete {
      color: green;
    }
    #status.error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Text to Speech</h1>
  <textarea id="text" rows="6" placeholder="Enter your text here..."></textarea><br><br>

  <label for="voice">Select Voice:</label>
  <select id="voice">
    <option value="alloy">Alloy</option>
    <option value="echo">Echo</option>
    <option value="fable">Fable</option>
    <option value="onyx">Onyx</option>
    <option value="nova">Nova</option>
    <option value="shimmer">Shimmer</option>
  </select><br><br>

  <button onclick="generate()">Generate Audio</button>

  <div id="progress-bar">
    <div id="progress"></div>
  </div>

  <div id="status"></div><br>

  <audio id="player" controls style="display: none;"></audio><br>
  <a id="downloadLink" style="display: none;" download="speech.mp3">Download MP3</a>

  <script>
    async function generate() {
      const text = document.getElementById("text").value;
      const voice = document.getElementById("voice").value;
      const progressBar = document.getElementById("progress-bar");
      const progress = document.getElementById("progress");
      const status = document.getElementById("status");
      const audio = document.getElementById("player");
      const download = document.getElementById("downloadLink");

      // Reset UI
      progressBar.style.display = "block";
      progress.style.width = "25%";
      status.innerText = "Processing...";
      status.className = "";
      audio.style.display = "none";
      download.style.display = "none";

      const formData = new FormData();
      formData.append("text", text);
      formData.append("voice", voice);

      try {
        const response = await fetch("https://generate-audio.onrender.com/generate-audio", {
          method: "POST",
          body: formData
        });

        progress.style.width = "60%";

        if (!response.ok) {
          const errText = await response.text();
          throw new Error("Server error: " + errText);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        audio.src = url;
        audio.style.display = "block";
        download.href = url;
        download.style.display = "inline";

        progress.style.width = "100%";
        status.innerText = "Complete";
        status.className = "complete";

      } catch (error) {
        status.innerText = "Error: " + error.message;
        status.className = "error";
        progressBar.style.display = "none";
      }
    }
  </script>
</body>
</html>
